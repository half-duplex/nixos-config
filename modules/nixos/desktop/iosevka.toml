[buildPlans.IosevkaCustomTerminal]
family = "Iosevka Custom Terminal"
spacing = "term"
serifs = "slab"
noCvSs = true
exportGlyphNames = false
noLigation = true

[buildPlans.IosevkaCustomTerminal.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaCustomTerminal.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.IosevkaCustomTerminal.widths.Normal]
shape = 600
menu = 5
css = "normal"

[buildPlans.IosevkaCustomTerminal.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaCustomTerminal.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
